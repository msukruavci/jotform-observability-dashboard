services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: observability
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observability -d observability"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    env_file: .env
    environment:
      RUN_MIGRATIONS: "1"
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --reload
    ports:
      - "8090:8000"
    volumes:
      - .:/app
      - ../jotform-workflow-mcp:/data/mcp:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/overview/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    env_file: .env
    command: celery -A config worker --loglevel=INFO --concurrency=2
    volumes:
      - .:/app
      - ../jotform-workflow-mcp:/data/mcp:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  beat:
    build: .
    env_file: .env
    command: celery -A config beat --loglevel=INFO
    volumes:
      - .:/app
      - ../jotform-workflow-mcp:/data/mcp:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
